<header class="site-header">
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-left">
        <i class="fa-solid fa-truck-fast"></i>
        <span>Frete grátis para compras acima de R$199,00</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-item">
          <i class="fa-solid fa-headset"></i>
          <span>Atendimento</span>
        </div>
        <div class="topbar-item">
          <i class="fa-brands fa-whatsapp"></i>
          <span>(34) 99999-9999</span>
        </div>
      </div>
    </div>
  </div>

  <div class="main-nav">
    <div class="container nav-inner">
      <a class="logo" href="/" aria-label="Logo eCafe">
        <img class="logo-img" src="/assets/images/logo.png" alt="Logo eCafe" />
      </a>

      <nav class="nav-links" role="navigation" aria-label="Main menu">
        <a class="nav-item" href="/">Início</a>
        <a class="nav-item" href="#produtos" data-action="products"
          >Produtos <i class="fa-solid fa-chevron-down"></i
        ></a>
        <a class="nav-item" href="#categorias" data-action="categories"
          >Categorias <i class="fa-solid fa-chevron-down"></i
        ></a>
        <a class="nav-item" href="#sobre-nos" data-action="about">Sobre nós</a>
        <a class="nav-item" href="#contato" data-action="contact">Contatos</a>
      </nav>

      <div class="nav-actions">
        <div class="search">
          <input
            type="search"
            placeholder="Buscar produtos..."
            aria-label="Buscar produtos"
          />
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
        </div>

        <a class="action action-login" href="/login.html">
          <i class="fa-regular fa-user"></i>
          <span>Entrar</span>
        </a>

        <a
          class="action action-cart cart"
          href="/pages/cart.html"
          aria-label="Carrinho"
        >
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="badge cart-count">0</span>
        </a>

        <button class="hamburger" aria-label="Abrir menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </div>
</header>
